  <rect x="0" y="0" width="600" height="3" fill="url(#accent2)" rx="2"/>
  <!-- Navbar -->
  <rect x="0" y="3" width="600" height="36" fill="rgba(0,212,255,0.05)"/>
  <text x="30" y="26" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">VoucherMall</text>
