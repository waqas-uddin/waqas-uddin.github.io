  <rect x="320" y="194" width="245" height="28" fill="rgba(109,179,63,0.12)" rx="6" stroke="#6DB33F" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="442" y="212" text-anchor="middle" fill="#6DB33F" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Spring Boot + MySQL Database</text>
  <!-- Auth badge -->
  <rect x="335" y="232" width="65" height="16" fill="rgba(0,212,255,0.12)" rx="8" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="368" y="243" text-anchor="middle" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="8">JWT Auth</text>
  <rect x="410" y="232" width="55" height="16" fill="rgba(0,212,255,0.12)" rx="8" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="437" y="243" text-anchor="middle" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="8">RBAC</text>
  <rect x="475" y="232" width="75" height="16" fill="rgba(0,212,255,0.12)" rx="8" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="513" y="243" text-anchor="middle" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="8">TypeScript</text>

  <!-- Voucher card 3 -->
  <rect x="22" y="256" width="265" height="60" fill="rgba(255,255,255,0.03)" rx="8" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="30" y="272" fill="rgba(255,255,255,0.4)" font-family="Inter, system-ui, sans-serif" font-size="9">My Vouchers (3 active)</text>
  <rect x="30" y="278" width="52" height="22" fill="rgba(0,212,255,0.1)" rx="5" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="56" y="293" text-anchor="middle" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="8">TECH30</text>
  <rect x="92" y="278" width="58" height="22" fill="rgba(0,153,187,0.1)" rx="5" stroke="#0099BB" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="121" y="293" text-anchor="middle" fill="#0099BB" font-family="Inter, system-ui, sans-serif" font-size="8">FASHION20</text>
  <rect x="160" y="278" width="55" height="22" fill="rgba(0,212,255,0.1)" rx="5" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="187" y="293" text-anchor="middle" fill="#00D4FF" font-family="Inter, system-ui, sans-serif" font-size="8">SAVE15</text>
