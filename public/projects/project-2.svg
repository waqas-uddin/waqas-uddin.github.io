  <line x1="442" y1="108" x2="442" y2="118" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 2"/>
  <rect x="320" y="118" width="245" height="28" fill="rgba(0,153,187,0.12)" rx="6" stroke="#0099BB" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="442" y="136" text-anchor="middle" fill="#0099BB" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Service Layer (Business Logic)</text>
  <line x1="442" y1="146" x2="442" y2="156" stroke="#0099BB" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 2"/>
