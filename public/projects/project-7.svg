<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000D1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001230;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00599C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0070C8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg7)" rx="12"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="600" height="3" fill="url(#accent7)" rx="2"/>
  <!-- Terminal window chrome -->
  <rect x="0" y="3" width="600" height="28" fill="rgba(0,89,156,0.15)"/>
  <circle cx="18" cy="17" r="5" fill="#FF5F57"/>
  <circle cx="34" cy="17" r="5" fill="#FEBC2E"/>
  <circle cx="50" cy="17" r="5" fill="#28C840"/>
  <text x="300" y="21" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">Computer Shop Management System — C++</text>

  <!-- Terminal content area -->
  <rect x="0" y="31" width="600" height="309" fill="rgba(0,0,0,0.5)"/>

  <!-- Banner ASCII art style -->
  <text x="20" y="54" fill="rgba(0,89,156,0.9)" font-family="monospace" font-size="9">+===========================================+</text>
  <text x="20" y="68" fill="rgba(0,89,156,0.9)" font-family="monospace" font-size="9">|   COMPUTER SHOP MANAGEMENT SYSTEM v1.0   |</text>
  <text x="20" y="82" fill="rgba(0,89,156,0.9)" font-family="monospace" font-size="9">+===========================================+</text>

  <!-- Menu -->
  <text x="20" y="100" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [1] View Inventory</text>
  <text x="20" y="114" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [2] Add Product</text>
  <text x="20" y="128" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [3] Process Sale</text>
  <text x="20" y="142" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [4] Customer Records</text>
  <text x="20" y="156" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [5] Sales Report</text>
  <text x="20" y="170" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9">  [0] Exit</text>
  <text x="20" y="188" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="9">Enter choice: 1</text>

  <!-- Inventory table -->
  <text x="20" y="208" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="8">---------------------------------------------------------------------------</text>
  <text x="20" y="220" fill="rgba(0,112,200,0.9)" font-family="monospace" font-size="8">ID    Product Name           Category    Qty    Price (PKR)</text>
  <text x="20" y="232" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="8">---------------------------------------------------------------------------</text>
  <text x="20" y="244" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">001   Dell Inspiron 15       Laptop       5     98,000.00</text>
  <text x="20" y="256" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">002   HP LaserJet Pro        Printer      3     45,500.00</text>
  <text x="20" y="268" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">003   Logitech MX Keys       Keyboard    12      8,200.00</text>
  <text x="20" y="280" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">004   Samsung 24" Monitor    Monitor      7     42,000.00</text>
  <text x="20" y="292" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="8">005   Seagate 2TB HDD        Storage     20     12,000.00</text>
  <text x="20" y="304" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="8">---------------------------------------------------------------------------</text>

  <!-- C++ badge and class info (right side overlay) -->
  <rect x="410" y="42" width="175" height="170" fill="rgba(0,0,0,0.6)" rx="8" stroke="rgba(0,89,156,0.4)" stroke-width="0.5"/>
  <text x="497" y="60" text-anchor="middle" fill="rgba(0,112,200,0.8)" font-family="monospace" font-size="9" font-weight="600">OOP DESIGN</text>
  <text x="418" y="78" fill="rgba(0,89,156,0.7)" font-family="monospace" font-size="8">class Product {</text>
  <text x="426" y="91" fill="rgba(0,89,156,0.6)" font-family="monospace" font-size="8">  string name;</text>
  <text x="426" y="104" fill="rgba(0,89,156,0.6)" font-family="monospace" font-size="8">  float price;</text>
  <text x="426" y="117" fill="rgba(0,89,156,0.6)" font-family="monospace" font-size="8">  int quantity;</text>
  <text x="426" y="130" fill="rgba(0,112,200,0.7)" font-family="monospace" font-size="8">  void display();</text>
  <text x="418" y="143" fill="rgba(0,89,156,0.7)" font-family="monospace" font-size="8">};</text>
  <text x="418" y="158" fill="rgba(0,89,156,0.7)" font-family="monospace" font-size="8">class Customer {</text>
  <text x="426" y="171" fill="rgba(0,89,156,0.6)" font-family="monospace" font-size="8">  string custName;</text>
  <text x="426" y="184" fill="rgba(0,89,156,0.6)" font-family="monospace" font-size="8">  vector&lt;Order&gt; orders;</text>
  <text x="418" y="200" fill="rgba(0,89,156,0.7)" font-family="monospace" font-size="8">};</text>

  <!-- Bottom: tech + prompt -->
  <text x="20" y="320" fill="rgba(34,197,94,0.7)" font-family="monospace" font-size="9">Total items in inventory: 5  |  Total value: 2,057,000 PKR</text>
  <text x="20" y="334" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9">Press any key to continue...</text>
  <!-- C++ badge -->
  <rect x="500" y="318" width="85" height="18" fill="rgba(0,89,156,0.2)" rx="8" stroke="rgba(0,89,156,0.5)" stroke-width="0.5"/>
  <text x="543" y="330" text-anchor="middle" fill="#0070C8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">C++ OOP</text>
</svg>
