  <rect x="225" y="220" width="330" height="36" fill="rgba(255,255,255,0.03)" rx="7"/>
  <rect x="228" y="223" width="30" height="30" fill="rgba(255,255,255,0.08)" rx="15"/>
  <text x="243" y="242" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter, system-ui, sans-serif" font-size="12">S</text>
  <text x="270" y="236" fill="rgba(255,255,255,0.6)" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">Sara Khan</text>
  <text x="270" y="247" fill="rgba(255,255,255,0.3)" font-family="Inter, system-ui, sans-serif" font-size="8">React, MongoDB, CSS</text>
